[supervisord]
nodaemon=true
; supervisord itself stays root so it can start the programs as appuser
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn
pidfile=/tmp/supervisord.pid
silent=false

[program:backend]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/backend
user=appuser
; File permission mask for files the app creates (UMASK env, default 022).
; Set per program: the [supervisord] umask only applies when it daemonizes.
umask=%(ENV_UMASK)s
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
; user= changes the UID but not HOME, which would stay /root (not writable)
environment=PYTHONPATH="/app/backend",HOME="/home/appuser",USER="appuser"

[program:frontend]
command=npm start
directory=/app/frontend
user=appuser
; File permission mask for files the app creates (UMASK env, default 022).
; Set per program: the [supervisord] umask only applies when it daemonizes.
umask=%(ENV_UMASK)s
environment=HOME="/home/appuser",USER="appuser"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
